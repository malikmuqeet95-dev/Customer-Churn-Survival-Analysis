<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChurnGuard AI | Customer Retention Survival Intelligence</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">⚡ ChurnGuard <span>Survival MLOps</span></div>
        <div class="badge">Cox Proportional Hazards Engine</div>
    </header>

    <main class="container">
        <!-- Input Form Section -->
        <section class="card">
            <h2>Customer Account Attributes</h2>
            <form id="prediction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Active Tenure (Months): <span id="tenure-val" class="highlight">3</span></label>
                        <input type="range" id="tenure" min="1" max="72" value="3" oninput="document.getElementById('tenure-val').innerText = this.value">
                    </div>

                    <div class="form-group">
                        <label>Forecast Horizon (+Months): <span id="horizon-val" class="highlight">6</span></label>
                        <input type="range" id="forecast_horizon" min="1" max="24" value="6" oninput="document.getElementById('horizon-val').innerText = this.value">
                    </div>

                    <div class="form-group">
                        <label>Monthly Charges ($)</label>
                        <input type="number" id="MonthlyCharges" value="75.0" step="0.5" required>
                    </div>

                    <div class="form-group">
                        <label>Total Charges ($)</label>
                        <input type="number" id="TotalCharges" value="225.0" step="1.0" required>
                    </div>

                    <div class="form-group">
                        <label>Senior Citizen</label>
                        <select id="SeniorCitizen">
                            <option value="0" selected>No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender">
                            <option value="Female">Female</option>
                            <option value="Male" selected>Male</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Partner</label>
                        <select id="Partner">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dependents</label>
                        <select id="Dependents">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Phone Service</label>
                        <select id="PhoneService">
                            <option value="Yes" selected>Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Multiple Lines</label>
                        <select id="MultipleLines">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Contract Type</label>
                        <select id="Contract">
                            <option value="Month-to-month" selected>Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Internet Service</label>
                        <select id="InternetService">
                            <option value="Fiber optic" selected>Fiber optic</option>
                            <option value="DSL">DSL</option>
                            <option value="No">No Internet Service</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tech Support</label>
                        <select id="TechSupport">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Online Security</label>
                        <select id="OnlineSecurity">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Online Backup</label>
                        <select id="OnlineBackup">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Device Protection</label>
                        <select id="DeviceProtection">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Streaming TV</label>
                        <select id="StreamingTV">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Streaming Movies</label>
                        <select id="StreamingMovies">
                            <option value="No" selected>No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="PaymentMethod">
                            <option value="Electronic check" selected>Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Paperless Billing</label>
                        <select id="PaperlessBilling">
                            <option value="Yes" selected>Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Calculate Survival Trajectory</button>
            </form>
        </section>

        <!-- Prediction Dashboard Section -->
        <section class="card">
            <h2>Real-Time Risk Intelligence</h2>
            
            <div class="metrics-grid">
                <div class="metric-box">
                    <span class="metric-title">Hazard Multiplier</span>
                    <span class="metric-value" id="res-hazard">--</span>
                </div>
                <div class="metric-box">
                    <span class="metric-title">Risk Tier</span>
                    <span class="metric-value" id="res-tier">--</span>
                </div>
                <div class="metric-box">
                    <span class="metric-title">Projected Retention</span>
                    <span class="metric-value" id="res-retention">--</span>
                </div>
                <div class="metric-box">
                    <span class="metric-title">Projected Churn</span>
                    <span class="metric-value" id="res-churn">--</span>
                </div>
            </div>

            <div class="alert-box">
                <span class="alert-label">Prescriptive Recommendation:</span>
                <p id="res-action">Awaiting prediction...</p>
            </div>

            <div id="plotly-chart"></div>
        </section>
    </main>

    <script src="/js/app.js?v=3"></script>
</body>
</html>
